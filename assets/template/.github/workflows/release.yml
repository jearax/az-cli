name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing: no NPM_TOKEN. A token in the environment would be used instead of OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: floor
        run: echo "node=$(node -p "require('./package.json').engines.node.replace(/^>=/, '')")" >> "$GITHUB_OUTPUT"

      # Trusted publishing needs npm >= 11.5.1; the Node 24 floor ships npm 11.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.floor.outputs.node }}

      # your_pm_setup_step

      - run: your_install_command

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: your_run_prefix build && your_run_prefix release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
